# 质量门禁：lint → 单测 → 构建 → 无头冒烟；main 通过后部署到 GitHub Pages。
# smoke 依赖 Chrome/Ubuntu runner 自带 Chromium 不在候选路径里，用 CHROME_PATH 指过去；
# 但 swiftshader 无头环境差异偶发误报，设为 continue-on-error 不卡门禁（失败会显示在 CI 日志里）。
# Pages 部署需要仓库 Settings → Pages → Source 选 "GitHub Actions"（一次性手动开关）。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run build

      - name: smoke
        continue-on-error: true
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          google-chrome --version || true
          node scripts/smoke.mjs

      - name: 上传 Pages 产物
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
