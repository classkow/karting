<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>卡丁车机械原理 · 交互式三维演示</title>
    <meta name="description" content="程序化建模的竞赛卡丁车三维机构演示：二冲程发动机剖视、链传动、齿轮齿条转向、后轴碟刹，支持爆炸分解与部件讲解。" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='7' fill='%23ffb547'/><circle cx='8' cy='8' r='3' fill='%230a0d12'/></svg>" />
    <link rel="stylesheet" href="/src/styles.css" />
    <style>
      /* 加载遮罩的关键兜底样式：即使外部样式表没加载（例如直接双击源码入口），
         遮罩也能正确全屏居中，而不是散落成一堆裸元素。数值与 styles.css 一致。 */
      #loader{position:fixed;inset:0;background:#05070b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:100;transition:opacity .5s}
      #loader.done{opacity:0;pointer-events:none}
      #loader svg{width:64px;height:64px}
      #loader p{color:#8fa0b4;font-size:13px;text-align:center;max-width:36em;padding:0 2em;line-height:1.8}
      .spin{transform-origin:18px 18px;animation:kart-spin 1.1s linear infinite}
      @keyframes kart-spin{to{transform:rotate(360deg)}}
      /* WebGL 上下文丢失遮罩（兜底样式，数值与 styles.css 一致） */
      #gl-lost{position:fixed;inset:0;background:rgba(5,7,11,.88);display:flex;align-items:center;justify-content:center;z-index:110}
      #gl-lost.hidden{display:none}
      #gl-lost .gl-lost-card{color:#e8edf4;text-align:center;max-width:30em;padding:0 2em;line-height:1.8}
      #gl-lost b{font-size:17px}
      #gl-lost p{color:#8fa0b4;font-size:13px;margin:10px 0}
      #gl-lost .gl-lost-sub{font-size:11px;color:#5c6b7d}
      #gl-lost button{cursor:pointer;margin-top:6px}
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>

      <header id="topbar">
        <div class="brand">
          <svg class="logo" viewBox="0 0 36 36" aria-hidden="true">
            <circle cx="18" cy="18" r="15.5" fill="none" stroke="#ffb547" stroke-width="2.4"/>
            <circle cx="18" cy="18" r="5.5" fill="none" stroke="#e8edf4" stroke-width="2"/>
            <circle cx="18" cy="18" r="1.6" fill="#ffb547"/>
            <g stroke="#8fa0b4" stroke-width="2">
              <path d="M18 2.5v6M18 27.5v6M2.5 18h6M27.5 18h6"/>
            </g>
          </svg>
          <div class="brand-tx">
            <h1>卡丁车机械原理</h1>
            <span>KART MECHANICS · 交互式三维演示</span>
          </div>
        </div>
        <div class="status">
          <span id="chip-engine" class="chip"><i class="dot"></i><b>引擎停止</b></span>
          <span id="chip-fps" class="chip alt">— FPS</span>
          <button id="btn-help" class="ghost sm" title="操作指南">? 指南</button>
        </div>
      </header>

      <aside id="parts-panel">
        <div class="panel-head">部件清单<span class="ph-sub">点击聚焦 · 悬停高亮</span></div>
        <div id="parts-list"></div>
      </aside>

      <aside id="control-panel"></aside>

      <div id="info-card" class="hidden"></div>
      <div id="tooltip" class="hidden"></div>

      <footer id="hint"><span class="hint-mouse">左键拖拽旋转 · 滚轮缩放 · 右键平移 · 点击部件查看原理 <kbd>?</kbd> 查看全部快捷键</span><span class="hint-touch">单指拖拽旋转 · 双指捏合缩放 · 点击部件查看原理</span></footer>

      <div id="help-overlay" class="hidden"></div>

      <div id="loader">
        <div class="loader-mark">
          <svg viewBox="0 0 36 36" aria-hidden="true">
            <circle cx="18" cy="18" r="15.5" fill="none" stroke="#ffb547" stroke-width="2.4" stroke-dasharray="70 28" class="spin"/>
            <circle cx="18" cy="18" r="5.5" fill="none" stroke="#e8edf4" stroke-width="2"/>
          </svg>
        </div>
        <p>正在装配卡丁车…</p>
      </div>

      <div id="gl-lost" class="hidden">
        <div class="gl-lost-card">
          <b>渲染已中断</b>
          <p>图形上下文丢失（可能是驱动重置或浏览器回收了 GPU 资源）。</p>
          <button id="gl-restore" class="ghost">尝试恢复</button>
          <p class="gl-lost-sub">若恢复无效，请刷新页面重试。</p>
        </div>
      </div>

      <script>
        // 启动守护：应用启动失败时（双击了源码入口 / 浏览器不支持 WebGL2 等），
        // 给出可操作的指引而不是无限转圈。正常启动后本脚本自行退出，无副作用。
        (function () {
          var told = false;
          window.__bootError = '';
          window.addEventListener('error', function (e) {
            if (!window.__bootError) {
              window.__bootError = (e && e.message) || (e && e.error && e.error.message) || '';
            }
          }, true);
          var t0 = Date.now();
          var timer = setInterval(function () {
            if (window.__kart) { clearInterval(timer); return; }
            var loader = document.getElementById('loader');
            if (!loader || told || Date.now() - t0 < 8000) return;
            told = true;
            clearInterval(timer);
            var svg = loader.querySelector('svg');
            var p = loader.querySelector('p');
            var msg;
            if (location.protocol === 'file:') {
              msg = '无法从这里启动：你打开的是需要构建工具的源码入口文件。\n\n' +
                '① 双击项目里的 start.bat（或 dist\\index.html）即可离线观看成品；\n' +
                '② 或在终端运行 npm run dev，再访问它提示的地址。';
            } else {
              msg = '三维引擎启动失败' + (window.__bootError ? '：' + window.__bootError : '') +
                '。\n当前浏览器可能不支持 WebGL2，请使用最新版 Chrome / Edge 后刷新重试。';
            }
            if (svg) svg.style.display = 'none';
            if (p) {
              p.style.whiteSpace = 'pre-line';
              p.style.letterSpacing = '0.05em';
              p.textContent = msg;
            }
            loader.style.cursor = 'pointer';
            loader.title = '点击关闭';
            loader.addEventListener('click', function () { loader.classList.add('done'); });
          }, 500);
        })();
      </script>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
